<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HALO - scan to start</title><meta name="theme-color" content="#000000"><link rel="icon" href="../icon.svg"><link rel="stylesheet" href="style.css?v=0.17.0"></head>
<body><main class="center">
<div class="brand" style="justify-content:center"><div class="logo" aria-hidden="true"></div><div style="text-align:left"><h1>HALO</h1><small>Crew health check</small></div></div><p>Scan the code with your phone to begin.</p>
<div class="card"><div id="qr" class="qr"></div><p class="url" id="url"></p><a class="btn" id="open" href="scan.html">Open on this device</a><button class="ghost" id="new">New session code</button></div>
</main>
<script src="vendor/qrcode.js"></script>
<script>
  function make() {
    var id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
    var url = new URL("scan.html?s=" + id, location.href).href;
    var qr = qrcode(0, "M"); qr.addData(url); qr.make();
    document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    document.getElementById("url").textContent = url; document.getElementById("open").href = url;
  }
  document.getElementById("new").addEventListener("click", make); make();
  if (/^(localhost|127\.|\[::1\])/.test(location.hostname) || location.protocol !== "https:") {
    var w = document.createElement("p"); w.className = "warn";
    w.textContent = /^(localhost|127\.)/.test(location.hostname) ? "This page is running on localhost, so a phone cannot open this code. Deploy the site (for example on Vercel) and open the deployed address here." : "This page is not on https, so phones will refuse the camera. Use the deployed https address.";
    document.querySelector(".card").appendChild(w);
  }
</script></body></html>
