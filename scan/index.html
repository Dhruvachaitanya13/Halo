<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HALO - scan to start</title><meta name="theme-color" content="#000000"><link rel="icon" href="../icon.svg"><link rel="stylesheet" href="style.css?v=0.18.0"></head>
<body><main>
<header class="top"><a class="brandmark" href="../" aria-label="HALO home"><span class="logo" aria-hidden="true"></span><span class="wordmark">HALO</span></a><span class="stepno">Health check</span></header>
<h1 class="title" style="margin-top:26px">Scan to start</h1><p class="sub">Point your phone camera at the code. The check opens in the phone's browser.</p>
<div class="card center"><div id="qr" class="qr"></div><p class="url" id="url"></p><a class="btn" id="open" href="scan.html">Open on this device</a><button class="ghost" id="new">New session code</button></div>
</main>
<script src="vendor/qrcode.js"></script>
<script>
  function make() {
    var id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
    var url = new URL("scan.html?s=" + id, location.href).href;
    var qr = qrcode(0, "M"); qr.addData(url); qr.make();
    document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    document.getElementById("url").textContent = url; document.getElementById("open").href = url;
  }
  document.getElementById("new").addEventListener("click", make); make();
  if (/^(localhost|127\.|\[::1\])/.test(location.hostname) || location.protocol !== "https:") {
    var w = document.createElement("p"); w.className = "warn";
    w.textContent = /^(localhost|127\.)/.test(location.hostname) ? "This page is running on localhost, so a phone cannot open this code. Open the published address of this page instead." : "This page is not on https, so phones will refuse the camera. Use the published https address.";
    document.querySelector(".card").appendChild(w);
  }
</script></body></html>
